---
apiVersion: v1
kind: Pod
metadata:
  name: vpn-hosta
  labels:
    name: vpn
spec:
  restartPolicy: Never
  hostname: hosta
  subdomain: vpn
  securityContext:
    runAsUser: 0
    runAsGroup: 0
  containers:
  - name: goes
    imagePullPolicy: IfNotPresent
    image: ko://github.com/platinasystems/goes/v2
    args:
    - "start"
    - "vpn"
    - "guest"
    - "-cert"
    - "hosta.pem"
    - "-v"
    securityContext:
      allowPrivilegeEscalation: true
      capabilities:
        add:
        - NET_ADMIN
      privileged: true
    ports:
    - protocol: UDP
      containerPort: 8003
    volumeMounts:
    - name: config
      mountPath: "/etc/goes/vpn"
      readOnly: true
  volumes:
  - name: config
    projected:
      sources:
      - secret:
          name: vpn-hosta
      - configMap:
          name: vpn
