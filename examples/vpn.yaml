apiVersion: v1
kind: Pod
metadata:
  name: vpn-registry
  labels:
    name: vpn
spec:
  restartPolicy: Never
  hostname: registry
  subdomain: vpn
  containers:
  - name: goes
    imagePullPolicy: IfNotPresent
    image: ko://github.com/platinasystems/goes/v2
    args:
    - "start"
    - "vpn"
    - "registry"
    - "-cert"
    - "registry.pem"
    - "-v"
    ports:
    - protocol: TCP
      containerPort: 8003
    volumeMounts:
    - name: config
      mountPath: "/etc/goes/vpn"
      readOnly: true
    - name: state
      mountPath: "/var/lib/goes/vpn"
  volumes:
  - name: config
    projected:
      sources:
      - secret:
          name: vpn-registry
      - configMap:
          name: vpn
  - name: state
    emptyDir:
      medium: Memory
      sizeLimit: 10Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: vpn-exchange0
  labels:
    name: vpn
spec:
  restartPolicy: Never
  hostname: exchange0
  subdomain: vpn
  containers:
  - name: goes
    imagePullPolicy: IfNotPresent
    image: ko://github.com/platinasystems/goes/v2
    args:
    - "start"
    - "vpn"
    - "exchange"
    - "-cert"
    - "exchange0.pem"
    - "-v"
    ports:
    - protocol: UDP
      containerPort: 8003
    volumeMounts:
    - name: config
      mountPath: "/etc/goes/vpn"
      readOnly: true
  volumes:
  - name: config
